<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام العمليات 2.3</title>
<style>
body{font-family:Tahoma,Arial;background:#eef5fb;margin:0}
header{background:#184a78;color:#fff;padding:18px}
.container{max-width:1000px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.12);text-align:center}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#1f6fb2;color:#fff;font-size:16px}
.note{margin-top:20px;background:#fff8e8;padding:14px;border-radius:10px}
</style>
</head>
<body>
<header>
<h2>نظام متابعة العمليات الميدانية 2.3</h2>
<div>مجموعة الفصل والإعادة</div>
</header>
<div class="container">
<div class="grid">
<div class="card"><h3>الرئيسية</h3><button>دخول</button></div>
<div class="card"><h3>سجل الحضور</h3><button>فتح</button></div>
<div class="card"><h3>التقرير اليومي</h3><button>فتح</button></div>
<div class="card"><h3>الإجازات</h3><button>فتح</button></div>
<div class="card"><h3>الأرشيف</h3><button>فتح</button></div>
<div class="card"><h3>الإعدادات</h3><button>دخول المالك</button></div>
</div>
<div class="note">
هذه نواة مشروع الإصدار 2.3 بملف HTML جديد. يمكن استكمال الوظائف وربطها لاحقًا.
</div>
</div>
</body>
</html>
