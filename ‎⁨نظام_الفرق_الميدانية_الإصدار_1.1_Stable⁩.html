<title>نظام الفرق الميدانية — الإصدار 1.1 Stable</title>
<style>
:root{--navy:#17356f;--navy2:#102a5a;--cyan:#58b8df;--bg:#eef5fa;--white:#fff;--line:#d7e2ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--navy)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(110deg,var(--navy2),var(--navy));color:#fff;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));box-shadow:0 4px 16px rgba(16,42,90,.16)}
.brand{text-align:center;font-size:18px;font-weight:900;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:900px;margin:auto}
.tab{border:0;border-radius:13px;padding:12px 8px;font-size:15px;font-weight:900;cursor:pointer;background:#eaf2f9;color:var(--navy)}
.tab.active{background:var(--cyan);color:var(--navy2)}
.stage{flex:1;min-height:0;padding:10px}
.frame{display:none;width:100%;height:calc(100vh - 104px);min-height:620px;border:0;border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(16,42,90,.10)}
.frame.active{display:block}
.note{position:fixed;left:10px;bottom:10px;background:rgba(16,42,90,.92);color:#fff;border-radius:10px;padding:7px 10px;font-size:11px;z-index:20}
@media(max-width:650px){.topbar{padding-top:max(10px,env(safe-area-inset-top))}.brand{font-size:15px}.tab{font-size:14px;padding:11px 5px}.stage{padding:0}.frame{height:calc(100vh - 100px);min-height:560px;border-radius:0;box-shadow:none}.note{display:none}}
@media print{.topbar,.note{display:none!important}.stage{padding:0}.frame{display:none!important;height:auto;box-shadow:none}.frame.active{display:block!important}}
</style>
</head>

const urls = {};
function makeUrl(key) {
  if (urls[key]) return urls[key];
  const binary = atob(modules[key]);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob = new Blob([bytes], {type:'text/html;charset=utf-8'});
  urls[key] = URL.createObjectURL(blob);
  return urls[key];
}
function loadFrames() {
  document.getElementById('attendanceFrame').src = makeUrl('attendance');
  document.getElementById('tasksFrame').src = makeUrl('tasks');
}
function openModule(name) {
  const isAttendance = name === 'attendance';
  document.getElementById('attendanceFrame').classList.toggle('active', isAttendance);
  document.getElementById('tasksFrame').classList.toggle('active', !isAttendance);
  document.getElementById('attendanceBtn').classList.toggle('active', isAttendance);
  document.getElementById('tasksBtn').classList.toggle('active', !isAttendance);
  try{localStorage.setItem('fieldSystemLastModule',name)}catch(e){}
}
window.addEventListener('DOMContentLoaded',()=>{
  loadFrames();
  let last='attendance';
  try{last=localStorage.getItem('fieldSystemLastModule')||'attendance'}catch(e){}
  openModule(last);
});
window.addEventListener('beforeunload',()=>Object.values(urls).forEach(u=>URL.revokeObjectURL(u)));
</script>
